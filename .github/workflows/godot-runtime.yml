name: Godot Runtime

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.6.1"
      GODOT_ZIP: "Godot_v4.6.1-stable_linux.x86_64.zip"
      GODOT_BIN: "Godot_v4.6.1-stable_linux.x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libfontconfig1 libglu1-mesa

      - name: Download Godot
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/$GODOT_BIN"

      - name: Run representative smoke suite
        working-directory: game
        run: |
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/systems_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/command_surface_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/app_shell_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/final_campaign_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/enemy_ai_wave_directives_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/ruleset_loader_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/campaign_carryover_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/hunger_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/spell_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/transport_smoke.gd
          "$RUNNER_TEMP/godot/$GODOT_BIN" --headless --path . --script res://scripts/tests/taming_smoke.gd
