name: Python Tools

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  importer-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run importer tests
        run: |
          python -m unittest discover -s tools/importers/tests -p "test_*.py"
